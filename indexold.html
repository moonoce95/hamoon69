<style>
#hamoon-space,
.hs-modal-overlay {
  --hs-bg: #0d0608;
  --hs-pink: #f4b8cc;
  --hs-gold: #e8b64c;

#hs-presence {

@keyframes hs-pulse {

}

.hs-btn {

  color: var(--hs-gold);
  border: 1px solid rgba(232,182,76,.28);
  border-radius: 9px;
  padding: 9px 12px;
  font-size: .88rem;
  cursor: pointer;
  font-weight: 650;
  transition: transform .14s ease, background .18s ease, border-color .18s ease;
}

.hs-btn:hover { background: rgba(232,182,76,.23); }
.hs-btn:active { transform: scale(.97); }

.hs-btn.active {
  background: rgba(232,182,76,.32);
  border-color: var(--hs-gold);
}

.hs-btn.danger {
  color: var(--hs-danger);
  border-color: rgba(255,127,141,.32);

}

  opacity:.34;

}

}

.hs-author-btn.selected {

}

#hs-toolbar {

  position:relative;
  width:100%;
  aspect-ratio:2 / 1;
  border:1px solid var(--hs-card-border);
  border-radius:14px;
  overflow:hidden;
  background-color:#1a0d12;
  background-image:radial-gradient(rgba(244,184,204,.11) .8px, transparent .8px);
  background-size:18px 18px;
  touch-action:pan-y;
  box-shadow:inset 0 0 40px rgba(0,0,0,.18);
}

#hs-canvas-wrap.mode-draw {
  touch-action:none;
  cursor:crosshair;
}

#hs-canvas-wrap.mode-erase {
  touch-action:none;
  cursor:cell;
}

#hs-canvas-wrap.mode-move {
  touch-action:pan-y;
  cursor:grab;

#hs-canvas {

}

.hs-note {
  position:absolute;
  min-width:128px;
  max-width:205px;

  padding:12px 12px 10px;

  transform:rotate(-.3deg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

.hs-note:nth-child(even) {

.hs-note.dragging {

.hs-note-author {

.hs-note-action {

.hs-note-action:hover {

.hs-note-move {

.hs-note-pink { background:#f4b8cc; }

<script>
(function () {
  "use strict";

  const API = "https://hamoon-counter.andy-ng199507.workers.dev";
  const WS_URL = "wss://hamoon-counter.andy-ng199507.workers.dev/space/live";
  const STORAGE_TOKEN = "hamoon_edit_token";
  const STORAGE_AUTHOR = "hamoon_author";

  const REACTION_EMOJIS = [
    "❤️",

    "😂",
    "😭",
    "💀",
    "🥹",

    "🐱"
  ];

  const AUTO_MEMORY_MAP = [
    ["VzzMUXaTI3Q", "making-of-video"],
    ["hamyok.mp4", "hamyok"],
    ["love1.png", "love1"],
    ["love1%20(2).png", "love2"],
    ["love1 (2).png", "love2"],
    ["inwhat.png", "inwhat"],
    ["31BIQdznu_E", "old-aram-video"],

    ["ok1.jpg", "ok1"],
    ["pepper.jpg", "pepper"],
    ["ilovehamy.jpg", "ilovehamy"],
    ["flounder.jpg", "flounder"],
    ["k_kfkMTncfnSqytLRS8m_g.mp4", "final-clip"],
    ["meow.opus", "meow"]
  ];

  const $ = (id) => document.getElementById(id);
  const canvasWrap = $("hs-canvas-wrap");
  const canvas = $("hs-canvas");

  let ctx = null;
  let toastTimer = null;
  let noteBeingEdited = null;
  let deleteAction = null;
  let eraseLastAt = 0;
  let wsReconnectTimer = null;
  let wsAttempts = 0;

  const state = {
    token: localStorage.getItem(STORAGE_TOKEN) || null,
    author: localStorage.getItem(STORAGE_AUTHOR) || null,
    unlocked: false,
    mode: "move",
    color: "#f4b8cc",
    thickness: 3,
    revision: 0,
    strokes: [],
    notes: [],
    reactions: [],
    presence: [],
    ws: null,
    wsConnected: false,
    drawing: false,
    currentStroke: null,
    draggingNote: null,
    dpr: 1,
    width: 0,
    height: 0
  };


  function showToast(message) {
    const el = $("hs-toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      el.classList.remove("show");
    }, 2200);
  }


  function requireEditor() {
    if (!state.unlocked) {
      showToast("unlock editing first ♡");
      return false;
    }

    if (!state.author) {
      showToast("pick ♡ Andy ♡ or ♡ Hamy ♡ first");
      return false;
    }

    return true;
  }


  function authHeaders(json) {
    const headers = {};

    if (json) {
      headers["Content-Type"] = "application/json";
    }

    if (state.token) {
      headers.Authorization = "Bearer " + state.token;
    }

    return headers;
  }


  async function apiFetch(path, options) {
    const response = await fetch(API + path, options || {});

    if (response.status === 401 || response.status === 403) {
      if (path !== "/space/auth") {
        lockEditor("edit session expired — unlock again ♡");
      }
    }

    if (!response.ok) {
      let detail = "";

      try {
        detail = await response.text();
      } catch (_) {}

      throw new Error(detail || ("HTTP " + response.status));
    }

    const type = response.headers.get("content-type") || "";

    if (type.includes("application/json")) {
      return response.json();
    }

    return null;
  }


  function normalizeStroke(s) {
    if (!s) return s;

    let points = s.points || [];

    if (typeof points === "string") {
      try {
        points = JSON.parse(points);
      } catch (_) {
        points = [];
      }
    }

    return {
      id: s.id,
      author: s.author || "",
      color: s.color || "#f4b8cc",
      width: Number(s.width || 3),
      points: Array.isArray(points) ? points : [],
      createdAt: s.createdAt || s.created_at || Date.now()
    };
  }


  function normalizeNote(n) {
    if (!n) return n;

    return {
      id: n.id,
      author: n.author || "Andy",
      text: n.text || "",
      x: Number(n.x || 0),
      y: Number(n.y || 0),
      color: n.color || n.theme || "pink",
      createdAt: n.createdAt || n.created_at || null,
      updatedAt: n.updatedAt || n.updated_at || null
    };
  }


  function normalizeReaction(r) {
    if (!r) return r;

    return {
      memoryId: r.memoryId || r.memory_id || "main",
      author: r.author || "",
      emoji: r.emoji || r.reaction || ""
    };
  }


  function init() {
    ctx = canvas.getContext("2d");

    setupCanvas();
    setupEventListeners();
    prepareMemoryTargets();
    loadState();
    connectWebSocket();

    if (state.author) {
      selectAuthor(state.author, false);
    }

    if (state.token) {
      checkTokenValidity();
    }

    updateUI();
  }


  /* =========================
     CANVAS
  ========================= */

  function setupCanvas() {
    const resize = () => {
      const rect = canvasWrap.getBoundingClientRect();

      state.dpr = Math.max(1, window.devicePixelRatio || 1);
      state.width = Math.max(1, rect.width);
      state.height = Math.max(1, rect.height);

      canvas.width = Math.round(state.width * state.dpr);
      canvas.height = Math.round(state.height * state.dpr);

      canvas.style.width = state.width + "px";
      canvas.style.height = state.height + "px";

      ctx.setTransform(
        state.dpr,
        0,
        0,
        state.dpr,
        0,
        0
      );

      redraw();
    };

    resize();

    window.addEventListener(
      "resize",
      resize,
      { passive:true }
    );
  }


  function getNormPoint(e) {
    const rect = canvas.getBoundingClientRect();

    return {
      x: Math.max(
        0,
        Math.min(
          1,
          (e.clientX - rect.left) / rect.width
        )
      ),

      y: Math.max(
        0,
        Math.min(
          1,
          (e.clientY - rect.top) / rect.height
        )
      )
    };
  }


  function renderWidth(storedWidth) {
    const scale = Math.max(
      .72,
      Math.min(
        1.45,
        state.width / 640
      )
    );

    return Math.max(
      .7,
      Number(storedWidth || 3) * scale
    );
  }


  function redraw() {
    if (!ctx) return;

    ctx.clearRect(
      0,
      0,
      state.width,
      state.height
    );

    state.strokes.forEach(drawStroke);
  }


  function drawStroke(stroke) {
    if (
      !ctx ||
      !stroke ||
      !Array.isArray(stroke.points) ||
      !stroke.points.length
    ) {
      return;
    }

    ctx.strokeStyle = stroke.color || "#f4b8cc";
    ctx.lineWidth = renderWidth(stroke.width);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();

    const first = stroke.points[0];

    ctx.moveTo(
      first.x * state.width,
      first.y * state.height
    );

    for (
      let i = 1;
      i < stroke.points.length;
      i++
    ) {
      const p = stroke.points[i];

      ctx.lineTo(
        p.x * state.width,
        p.y * state.height
      );
    }

    if (stroke.points.length === 1) {
      ctx.lineTo(
        first.x * state.width + .01,
        first.y * state.height + .01
      );
    }

    ctx.stroke();
  }


  function onPointerDown(e) {
    if (
      !requireEditor() ||
      state.mode === "move"
    ) {
      return;
    }

    e.preventDefault();

    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (_) {}

    const pt = getNormPoint(e);

    if (state.mode === "draw") {
      state.drawing = true;

      state.currentStroke = {
        id: crypto.randomUUID(),
        author: state.author,
        color: state.color,
        width: state.thickness,
        points: [pt],
        createdAt: Date.now()
      };
    }

    else if (state.mode === "erase") {
      eraseAtPoint(pt);
    }
  }


  function onPointerMove(e) {
    if (
      !state.unlocked ||
      state.mode === "move"
    ) {
      return;
    }

    e.preventDefault();

    const pt = getNormPoint(e);

    if (
      state.mode === "draw" &&
      state.drawing &&
      state.currentStroke
    ) {
      const pts = state.currentStroke.points;
      const last = pts[pts.length - 1];

      const dx = pt.x - last.x;
      const dy = pt.y - last.y;

      if (
        (dx * dx + dy * dy) <
        0.0000018
      ) {
        return;
      }

      pts.push(pt);

      ctx.strokeStyle =
        state.currentStroke.color;

      ctx.lineWidth =
        renderWidth(
          state.currentStroke.width
        );

      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();

      ctx.moveTo(
        last.x * state.width,
        last.y * state.height
      );

      ctx.lineTo(
        pt.x * state.width,
        pt.y * state.height
      );

      ctx.stroke();
    }

    else if (state.mode === "erase") {
      eraseAtPoint(pt);
    }
  }


  function onPointerUp() {
    if (
      state.mode !== "draw" ||
      !state.drawing ||
      !state.currentStroke
    ) {
      return;
    }

    state.drawing = false;

    const stroke =
      state.currentStroke;

    state.currentStroke = null;

    state.strokes.push(stroke);

    redraw();
    sendStroke(stroke);
  }


  function eraseAtPoint(pt) {
    const now = Date.now();

    if (
      now - eraseLastAt <
      70
    ) {
      return;
    }

    eraseLastAt = now;

    fetch(
      API + "/space/erase-point",
      {
        method:"POST",

        headers:
          authHeaders(true),

        body:
          JSON.stringify({
            x:pt.x,
            y:pt.y,
            radius:.03,
            author:state.author
          })
      }
    )

    .then(async (r) => {
      if (!r.ok) {
        throw new Error(
          await r.text()
        );
      }

      return r.json();
    })

    .then((data) => {
      const ids =
        data.erased ||
        data.strokeIds ||
        [];

      if (ids.length) {
        state.strokes =
          state.strokes.filter(
            (s) =>
              !ids.includes(s.id)
          );

        redraw();
      }
    })

    .catch(() =>
      showToast(
        "eraser didn't save — try again"
      )
    );
  }


  function sendStroke(stroke) {
    apiFetch(
      "/space/stroke",
      {
        method:"POST",

        headers:
          authHeaders(true),

        body:
          JSON.stringify(stroke)
      }
    )

    .catch(() => {
      showToast(
        "that stroke didn't save 😭"
      );

      loadState();
    });
  }


  function doUndo() {
    if (!requireEditor()) return;

    apiFetch(
      "/space/undo",
      {
        method:"POST",

        headers:
          authHeaders(true),

        body:
          JSON.stringify({
            author:state.author
          })
      }
    )

    .then(loadState)

    .catch(() =>
      showToast(
        "nothing to undo / undo failed"
      )
    );
  }


  function doRedo() {
    if (!requireEditor()) return;

    apiFetch(
      "/space/redo",
      {
        method:"POST",

        headers:
          authHeaders(true),

        body:
          JSON.stringify({
            author:state.author
          })
      }
    )

    .then(loadState)

    .catch(() =>
      showToast(
        "nothing to redo / redo failed"
      )
    );
  }


  /* =========================
     AUTH / AUTHOR
  ========================= */

  function attemptUnlock() {
    const pin =
      $("hs-pin-input").value.trim();

    if (!pin) return;

    apiFetch(
      "/space/auth",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({pin})
      }
    )

    .then((data) => {
      if (
        !data ||
        !data.token
      ) {
        throw new Error(
          "No token returned"
        );
      }

      state.token =
        data.token;

      localStorage.setItem(
        STORAGE_TOKEN,
        state.token
      );

      state.unlocked = true;

      $("hs-pin-input").value = "";

      updateUI();
      reconnectWebSocket();

      showToast(
        "editing unlocked ♡"
      );
    })

    .catch(() =>
      showToast(
        "wrong PIN / couldn't unlock"
      )
    );
  }


  function checkTokenValidity() {
    fetch(
      API + "/space/snapshots",
      {
        headers:
          authHeaders(false)
      }
    )

    .then((r) => {
      if (
        r.status === 401 ||
        r.status === 403
      ) {
        lockEditor();
      }

      else if (r.ok) {
        state.unlocked = true;

        updateUI();
        reconnectWebSocket();
      }
    })

    .catch(() => {});
  }


  function lockEditor(message) {
    state.token = null;
    state.unlocked = false;

    localStorage.removeItem(
      STORAGE_TOKEN
    );

    setMode("move");

    updateUI();
    reconnectWebSocket();

    if (message) {
      showToast(message);
    }
  }


  function selectAuthor(
    name,
    reconnect = true
  ) {
    if (
      name !== "Andy" &&
      name !== "Hamy"
    ) {
      return;
    }

    state.author = name;

    localStorage.setItem(
      STORAGE_AUTHOR,
      name
    );

    document
      .querySelectorAll(
        "#hs-author-select .hs-author-btn"
      )
      .forEach((b) => {
        b.classList.toggle(
          "selected",
          b.dataset.author === name
        );
      });

    renderNotes();
    renderReactionBars();

    if (reconnect) {
      reconnectWebSocket();
    }
  }


  function setMode(mode) {
    if (
      ![
        "move",
        "draw",
        "erase"
      ].includes(mode)
    ) {
      return;
    }

    state.mode = mode;

    document
      .querySelectorAll(
        ".hs-mode-btn"
      )
      .forEach((b) => {
        b.classList.toggle(
          "active",
          b.dataset.mode === mode
        );
      });

    canvasWrap.className =
      "mode-" + mode;
  }


  function updateUI() {
    const editor =
      state.unlocked;

    $("hs-unlock-bar").style.display =
      editor
        ? "none"
        : "flex";

    $("hs-author-select").style.display =
      editor
        ? "flex"
        : "none";

    $("hs-toolbar").style.display =
      editor && state.author
        ? "flex"
        : "none";

    $("hs-add-note-bar").style.display =
      editor && state.author
        ? "block"
        : "none";

    if (
      !editor ||
      !state.author
    ) {
      setMode("move");
    }

    renderNotes();
    renderReactionBars();
  }


  /* =========================
     STATE
  ========================= */

  async function loadState() {
    try {
      const data =
        await apiFetch(
          "/space/state"
        );

      state.revision =
        Number(
          data.revision || 0
        );

      state.strokes =
        (data.strokes || [])
          .map(normalizeStroke)
          .filter(Boolean);

      state.notes =
        (
          data.stickyNotes ||
          data.notes ||
          []
        )
          .map(normalizeNote)
          .filter(Boolean);

      state.reactions =
        (data.reactions || [])
          .map(normalizeReaction)
          .filter(Boolean);

      state.presence =
        Array.isArray(data.presence)
          ? data.presence
          : [];

      redraw();
      renderNotes();
      renderReactionBars();
      renderPresence();
    }

    catch (_) {
      showToast(
        "couldn't load the shared space"
      );
    }
  }


  /* =========================
     WEBSOCKET / PRESENCE
  ========================= */

  function buildWsUrl() {
    const params =
      new URLSearchParams();

    if (state.author) {
      params.set(
        "author",
        state.author
      );
    }

    if (state.token) {
      params.set(
        "token",
        state.token
      );
    }

    const query =
      params.toString();

    return (
      WS_URL +
      (
        query
          ? "?" + query
          : ""
      )
    );
  }


  function reconnectWebSocket() {
    clearTimeout(
      wsReconnectTimer
    );

    wsReconnectTimer = null;
    wsAttempts = 0;

    const old =
      state.ws;

    state.ws = null;

    if (old) {
      try {
        old.close();
      } catch (_) {}
    }

    connectWebSocket();
  }


  function scheduleReconnect() {
    if (wsReconnectTimer) {
      return;
    }

    const delay =
      Math.min(
        15000,
        900 *
          Math.pow(
            2,
            Math.min(
              wsAttempts,
              4
            )
          )
      ) +
      Math.floor(
        Math.random() * 350
      );

    wsAttempts++;

    $("hs-conn-status").textContent =
      "reconnecting…";

    $("hs-conn-status").style.color =
      "";

    wsReconnectTimer =
      setTimeout(
        () => {
          wsReconnectTimer = null;
          connectWebSocket();
        },
        delay
      );
  }


  function connectWebSocket() {
    const ws =
      new WebSocket(
        buildWsUrl()
      );

    state.ws = ws;

    $("hs-conn-status").textContent =
      "connecting…";

    ws.onopen = () => {
      if (
        state.ws !== ws
      ) {
        return;
      }

      state.wsConnected = true;
      wsAttempts = 0;

      $("hs-conn-status").textContent =
        "connected ❤️";

      $("hs-conn-status").style.color =
        "#75db9a";

      loadState();
    };


    ws.onmessage = (event) => {
      if (
        state.ws !== ws
      ) {
        return;
      }

      try {
        handleWSMessage(
          JSON.parse(
            event.data
          )
        );
      }

      catch (_) {}
    };


    ws.onerror = () => {};


    ws.onclose = () => {
      if (
        state.ws !== ws
      ) {
        return;
      }

      state.wsConnected = false;

      $("hs-conn-status").textContent =
        "offline · reconnecting…";

      $("hs-conn-status").style.color =
        "";

      scheduleReconnect();
    };
  }


  function handleWSMessage(msg) {
    if (
      !msg ||
      !msg.type
    ) {
      return;
    }

    switch (msg.type) {

      case "init": {
        const s =
          msg.state || {};

        state.revision =
          Number(
            s.revision ||
            state.revision ||
            0
          );

        state.strokes =
          (s.strokes || [])
            .map(normalizeStroke);

        state.notes =
          (
            s.stickyNotes ||
            s.notes ||
            []
          )
            .map(normalizeNote);

        state.reactions =
          (s.reactions || [])
            .map(normalizeReaction);

        state.presence =
          Array.isArray(
            s.presence
          )
            ? s.presence
            : [];

        redraw();
        renderNotes();
        renderReactionBars();
        renderPresence();

        break;
      }


      case "stroke":
      case "stroke.added": {
        const stroke =
          normalizeStroke(
            msg.stroke
          );

        if (
          stroke &&
          !state.strokes.some(
            (s) =>
              s.id === stroke.id
          )
        ) {
          state.strokes.push(
            stroke
          );

          drawStroke(
            stroke
          );
        }

        break;
      }


      case "erase": {
        const id =
          msg.strokeId ||
          msg.id;

        state.strokes =
          state.strokes.filter(
            (s) =>
              s.id !== id
          );

        redraw();
        break;
      }


      case "erase-batch":
      case "stroke.erased": {
        const ids =
          msg.strokeIds ||
          msg.ids ||
          [];

        state.strokes =
          state.strokes.filter(
            (s) =>
              !ids.includes(s.id)
          );

        redraw();
        break;
      }


      case "restore_stroke":
      case "restore":
      case "board.restored":

        loadState();

        break;


      case "clear":
      case "board.cleared":

        state.strokes = [];
        redraw();

        break;


      case "presence":

        state.presence =
          msg.present ||
          msg.presence ||
          [];

        renderPresence();

        break;


      case "note":
      case "note.created": {
        const note =
          normalizeNote(
            msg.note
          );

        if (
          note &&
          !state.notes.some(
            (n) =>
              n.id === note.id
          )
        ) {
          state.notes.push(
            note
          );
        }

        renderNotes();

        break;
      }


      case "note_update":
      case "note.updated": {
        const raw =
          msg.note || {};

        const id =
          raw.id ||
          msg.id ||
          msg.noteId;

        const idx =
          state.notes.findIndex(
            (n) =>
              n.id === id
          );

        if (idx >= 0) {
          const next =
            Object.assign(
              {},
              state.notes[idx]
            );

          if (
            raw.author !== undefined
          ) {
            next.author =
              raw.author;
          }

          if (
            raw.text !== undefined
          ) {
            next.text =
              raw.text;
          }

          if (
            raw.x !== undefined
          ) {
            next.x =
              Number(raw.x);
          }

          if (
            raw.y !== undefined
          ) {
            next.y =
              Number(raw.y);
          }

          if (
            raw.color !== undefined ||
            raw.theme !== undefined
          ) {
            next.color =
              raw.color ||
              raw.theme;
          }

          if (
            raw.updatedAt !== undefined ||
            raw.updated_at !== undefined
          ) {
            next.updatedAt =
              raw.updatedAt ||
              raw.updated_at;
          }

          state.notes[idx] =
            next;
        }

        else if (raw.id) {
          state.notes.push(
            normalizeNote(raw)
          );
        }

        renderNotes();

        break;
      }


      case "note_delete":
      case "note.deleted": {
        const id =
          msg.id ||
          msg.noteId;

        state.notes =
          state.notes.filter(
            (n) =>
              n.id !== id
          );

        renderNotes();

        break;
      }


      case "reaction":
      case "reaction.updated": {
        const memoryId =
          msg.memoryId ||
          msg.memory_id;

        const author =
          msg.author;

        const emoji =
          msg.emoji;

        if (
          !memoryId ||
          !author ||
          !emoji
        ) {
          loadState();
          break;
        }

        const exists =
          state.reactions.some(
            (r) =>
              r.memoryId === memoryId &&
              r.author === author &&
              r.emoji === emoji
          );

        const active =
          msg.active !== false;

        if (
          active &&
          !exists
        ) {
          state.reactions.push({
            memoryId,
            author,
            emoji
          });
        }

        if (
          !active &&
          exists
        ) {
          state.reactions =
            state.reactions.filter(
              (r) =>
                !(
                  r.memoryId === memoryId &&
                  r.author === author &&
                  r.emoji === emoji
                )
            );
        }

        renderReactionBars();

        break;
      }


      default:

        if (
          msg.revision &&
          Number(msg.revision) >
          state.revision + 1
        ) {
          loadState();
        }
    }
  }


  function renderPresence() {
    const el =
      $("hs-presence");

    const names =
      Array.from(
        new Set(
          (
            state.presence ||

    }

  async function loadSnapshots() {
    if (!requireEditor()) {
      return;
    }

    try {
      const data =
        await apiFetch(
          "/space/snapshots",
          {
            headers:
              authHeaders(false)
          }
        );

      const snaps =
        Array.isArray(data)
          ? data
          : (
              data &&
              data.snapshots
            ) ||
            [];

      const list =
        $("hs-snap-list");

      list.innerHTML = "";

      if (!snaps.length) {
        list.innerHTML =
          "<div style='color:rgba(244,184,204,.48);padding:7px 2px;font-family:system-ui;font-size:.8rem'>no snapshots yet</div>";

        return;
      }

      snaps.forEach(
        (snap) => {
          const row =
            document.createElement(
              "div"
            );

          row.className =
            "hs-snap-item";

          const dateValue =
            snap.createdAt ||
            snap.created_at;

          const label =
            document.createElement(
              "span"
            );

          label.textContent =
            dateValue
              ? new Date(
                  dateValue
                ).toLocaleString()
              : (
                  "snapshot " +
                  snap.id
                );

          const btn =
            document.createElement(
              "button"
            );

          btn.className =
            "hs-btn";

          btn.textContent =
            "Restore";

          btn.addEventListener(
            "click",
            () =>
              restoreSnapshot(
                snap.id
              )
          );

          row.append(
            label,
            btn
          );

          list.appendChild(
            row
          );
        }
      );
    }

    catch (_) {
      showToast(
        "couldn't load history"
      );
    }
  }

  function createNoteElement(note) {

    div.append(

    if (state.unlocked) {
      const actions =
        document.createElement(

      const edit =

          "button"
        );

      edit.className =
        "hs-note-action";

      edit.type =
        "button";

      edit.title =

      edit.textContent =
        "✎";

      edit.addEventListener(
        "click",
        (e) => {
          e.stopPropagation();

          openNoteModal(
            note
          );
        }
      );


      const del =
        document.createElement(
          "button"
        );

      del.className =
        "hs-note-action";

      del.type =
        "button";

      del.title =
        "Delete note";

      del.textContent =

      del.addEventListener(
        "click",
        (e) => {
          e.stopPropagation();

          openDeleteModal(
            "delete this sticky note?",
            () =>
              deleteNote(
                note.id
              )
          );
        }
      );


      actions.append(
        move,
        edit,
        del
      );

      div.appendChild(
        actions
      );

      setupNoteDrag(
        move,
        div,
        note,
        container
      );
    }

    return div;
  }


  function setupNoteDrag(
    handle,
    div,
    note,
    container
  ) {
    handle.addEventListener(
      "pointerdown",
      (e) => {
        if (!requireEditor()) {
          return;
        }

        e.preventDefault();
        e.stopPropagation();

        try {
          handle.setPointerCapture(
            e.pointerId
          );
        }

        catch (_) {}

        state.draggingNote = {
          id:note.id,
          startX:e.clientX,
          startY:e.clientY,
          origX:note.x,
          origY:note.y
        };

        div.classList.add(
          "dragging"
        );
      }
    );


    handle.addEventListener(
      "pointermove",
      (e) => {
        const d =
          state.draggingNote;

        if (
          !d ||
          d.id !== note.id
        ) {
          return;
        }

        e.preventDefault();

        const rect =
          container.getBoundingClientRect();

        const x =
          clamp(
            d.origX +
              (
                e.clientX -
                d.startX
              ) /
              rect.width,
            0,
            .82
          );

        const y =
          clamp(
            d.origY +
              (
                e.clientY -
                d.startY
              ) /
              rect.height,
            0,
            .82
          );

        div.style.left =
          (
            x *
            100
          ) +
          "%";

        div.style.top =
          (
            y *
            100
          ) +
          "%";
      }
    );


    const finish = () => {
      const d =
        state.draggingNote;

      if (
        !d ||
        d.id !== note.id
      ) {
        return;
      }

      const x =
        parseFloat(
          div.style.left
        ) /
        100;

      const y =
        parseFloat(
          div.style.top
        ) /
        100;

      state.draggingNote =
        null;

      div.classList.remove(
        "dragging"
      );

      note.x =
        x;

      note.y =
        y;

      updateNote(
        note.id,
        {x,y}
      );
    };


    handle.addEventListener(
      "pointerup",
      finish
    );

    handle.addEventListener(
      "pointercancel",
      finish
    );
  }

  /* =========================
     REACTIONS
  ========================= */

  function getMediaSource(el) {
    let src =
      el.getAttribute("src") ||
      "";

    if (
      !src &&
      (
        el.tagName === "VIDEO" ||
        el.tagName === "AUDIO"
      )
    ) {
      const source =
        el.querySelector(
          "source[src]"
        );

      if (source) {
        src =
          source.getAttribute(
            "src"
          ) ||
          "";
      }
    }

    return src;
  }


  function prepareMemoryTargets() {
    const media =
      Array.from(
        document.querySelectorAll(
          "img,video,audio,iframe"
        )
      )

      .filter(
        (el) =>
          !el.closest(
            "#hamoon-space"
          ) &&
          !el.closest(
            ".hs-modal-overlay"
          )
      );


    media.forEach(
      (el) => {
        if (
          el.dataset.memoryId
        ) {
          return;
        }

        const src =
          getMediaSource(el);

        for (
          const pair of
          AUTO_MEMORY_MAP
        ) {
          if (
            src &&
            src.includes(
              pair[0]
            )
          ) {
            el.dataset.memoryId =
              pair[1];

            break;
          }
        }
      }
    );

    renderReactionBars();
  }


  function reactionAnchorFor(media) {
    const figure =
      media.closest(
        "figure"
      );

    if (figure) {
      return figure;
    }

    const parent =
      media.parentElement;

    if (
      parent &&
      /video|media|embed|frame|clip/i.test(
        parent.className ||
        ""
      )
    ) {
      return parent;
    }

    return media;
  }


  function renderReactionBars() {
    const targets =
      Array.from(
        document.querySelectorAll(
          "[data-memory-id]"
        )
      )

      .filter(
        (el) =>
          !el.closest(
            "#hamoon-space"
          )
      );


    targets.forEach(
      (media) => {
        const memoryId =
          media.dataset.memoryId;

        if (!memoryId) {
          return;
        }

        const anchor =
          reactionAnchorFor(
            media
          );

        let bar =
          document.querySelector(
            '.hs-memory-reactions[data-for="' +
            cssEscape(
              memoryId
            ) +
            '"]'
          );


        if (!bar) {
          bar =
            document.createElement(
              "div"
            );

          bar.className =
            "hs-memory-reactions";

          bar.dataset.for =
            memoryId;

          anchor.insertAdjacentElement(
            "afterend",
            bar
          );
        }


        buildReactionBar(
          bar,
          memoryId
        );
      }
    );
  }


  function buildReactionBar(
    bar,
    memoryId
  ) {
    bar.innerHTML =
      "";

    const reactions =
      state.reactions.filter(
        (r) =>
          r.memoryId ===
          memoryId
      );

    const counts =
      new Map();


    reactions.forEach(
      (r) =>
        counts.set(
          r.emoji,
          (
            counts.get(
              r.emoji
            ) ||
            0
          ) +
          1
        )
    );


    REACTION_EMOJIS.forEach(
      (emoji) => {
        const count =
          counts.get(
            emoji
          ) ||
          0;

        if (!count) {
          return;
        }


        const mine =
          reactions.some(
            (r) =>
              r.author ===
                state.author &&
              r.emoji ===
                emoji
          );


        const b =
          document.createElement(
            "button"
          );

        b.type =
          "button";

        b.className =
          "hs-used-reaction" +
          (
            mine
              ? " mine"
              : ""
          );

        b.textContent =
          emoji +
          " " +
          count;

        b.title =
          state.unlocked
            ? "Toggle " +
              emoji
            : "Unlock to react";


        b.addEventListener(
          "click",
          () =>
            toggleReaction(
              memoryId,
              emoji
            )
        );


        bar.appendChild(
          b
        );
      }
    );


    const open =
      document.createElement(
        "button"
      );

    open.type =
      "button";

    open.className =
      "hs-react-open";

    open.textContent =
      state.unlocked
        ? "♡ react"
        : "reactions ♡";

    bar.appendChild(
      open
    );


    const picker =
      document.createElement(
        "div"
      );

    picker.className =
      "hs-inline-picker";


    REACTION_EMOJIS.forEach(
      (emoji) => {
        const mine =
          reactions.some(
            (r) =>
              r.author ===
                state.author &&
              r.emoji ===
                emoji
          );


        const b =
          document.createElement(
            "button"
          );

        b.type =
          "button";

        b.className =
          "hs-emoji-choice" +
          (
            mine
              ? " mine"
              : ""
          );

        b.textContent =
          emoji;

        b.title =
          emoji;


        b.addEventListener(
          "click",
          () =>
            toggleReaction(
              memoryId,
              emoji
            )
        );


        picker.appendChild(
          b
        );
      }
    );


    bar.appendChild(
      picker
    );


    open.addEventListener(
      "click",
      () => {
        if (!requireEditor()) {
          return;
        }

        picker.classList.toggle(
          "show"
        );
      }
    );
  }


  function toggleReaction(
    memoryId,
    emoji
  ) {
    if (!requireEditor()) {
      return;
    }

    if (
      !REACTION_EMOJIS.includes(
        emoji
      )
    ) {
      return;
    }


    const idx =
      state.reactions.findIndex(
        (r) =>
          r.memoryId ===
            memoryId &&
          r.author ===
            state.author &&
          r.emoji ===
            emoji
      );


    if (idx >= 0) {
      state.reactions.splice(
        idx,
        1
      );
    }

    else {
      state.reactions.push({
        memoryId,
        author:state.author,
        emoji
      });
    }


    renderReactionBars();


    apiFetch(
      "/space/reaction",
      {
        method:"POST",

        headers:
          authHeaders(true),

        body:
          JSON.stringify({
            memoryId,
            author:state.author,
            emoji
          })
      }
    )

    .then(
      () =>
        loadState()
    )

    .catch(() => {
      showToast(
        "reaction didn't save"
      );

      loadState();
    });
  }


  /* =========================
     EVENTS
  ========================= */

  function setupEventListeners() {
    $("hs-unlock-btn")
      .addEventListener(
        "click",
        attemptUnlock
      );


    $("hs-pin-input")
      .addEventListener(
        "keydown",
        (e) => {
          if (
            e.key === "Enter"
          ) {
            attemptUnlock();
          }
        }
      );


    document
      .querySelectorAll(
        "#hs-author-select .hs-author-btn"
      )
      .forEach(
        (btn) => {
          btn.addEventListener(
            "click",
            () =>
              selectAuthor(
                btn.dataset.author
              )
          );
        }
      );


    document
      .querySelectorAll(
        ".hs-mode-btn"
      )
      .forEach(
        (btn) => {
          btn.addEventListener(
            "click",
            () =>
              setMode(
                btn.dataset.mode
              )
          );
        }
      );


    const swatches =
      Array.from(
        document.querySelectorAll(
          ".hs-color-swatch"
        )
      );


    swatches.forEach(
      (sw) => {
        sw.addEventListener(
          "click",
          () => {
            swatches.forEach(
              (x) =>
                x.classList.remove(
                  "selected"
                )
            );

            sw.classList.add(
              "selected"
            );

            state.color =
              sw.dataset.color;
          }
        );
      }
    );


    $("hs-custom-color")
      .addEventListener(
        "input",
        (e) => {
          state.color =
            e.target.value;

          swatches.forEach(
            (x) =>
              x.classList.remove(
                "selected"
              )
          );
        }
      );


    $("hs-thickness")
      .addEventListener(
        "input",
        (e) => {
          state.thickness =
            Number(
              e.target.value
            );
        }
      );


    $("hs-undo-btn")
      .addEventListener(
        "click",
        doUndo
      );


    $("hs-redo-btn")
      .addEventListener(
        "click",
        doRedo
      );


    $("hs-history-btn")
      .addEventListener(
        "click",
        toggleHistory
      );


    $("hs-clear-btn")
      .addEventListener(
        "click",
        openClearModal
      );


    $("hs-add-note-btn")
      .addEventListener(
        "click",
        () =>
          openNoteModal(
            null
          )
      );


    canvas.addEventListener(
      "pointerdown",
      onPointerDown
    );

    canvas.addEventListener(
      "pointermove",
      onPointerMove
    );

    canvas.addEventListener(
      "pointerup",
      onPointerUp
    );

    canvas.addEventListener(
      "pointercancel",
      onPointerUp
    );

    canvas.addEventListener(
      "pointerleave",
      onPointerUp
    );


    $("hs-clear-confirm")
      .addEventListener(
        "input",
        (e) => {
          $("hs-clear-confirm-btn").disabled =
            e.target.value !==
            "69";
        }
      );


    $("hs-clear-confirm")
      .addEventListener(
        "keydown",
        (e) => {
          if (
            e.key === "Enter" &&
            e.target.value ===
              "69"
          ) {
            doClear();
          }
        }
      );


    $("hs-clear-confirm-btn")
      .addEventListener(
        "click",
        doClear
      );


    $("hs-clear-cancel-btn")
      .addEventListener(
        "click",
        closeClearModal
      );


    $("hs-note-save-btn")
      .addEventListener(
        "click",
        saveNoteModal
      );


    $("hs-note-cancel-btn")
      .addEventListener(
        "click",
        closeNoteModal
      );


    $("hs-delete-confirm")
      .addEventListener(
        "input",
        (e) => {
          $("hs-delete-confirm-btn").disabled =
            e.target.value !==
            "69";
        }
      );


    $("hs-delete-confirm")
      .addEventListener(
        "keydown",
        (e) => {
          if (
            e.key === "Enter" &&
            e.target.value ===
              "69"
          ) {
            confirmDeleteAction();
          }
        }
      );


    $("hs-delete-confirm-btn")
      .addEventListener(
        "click",
        confirmDeleteAction
      );


    $("hs-delete-cancel-btn")
      .addEventListener(
        "click",
        closeDeleteModal
      );


    document
      .querySelectorAll(
        ".hs-modal-overlay"
      )
      .forEach(
        (modal) => {
          modal.addEventListener(
            "pointerdown",
            (e) => {
              if (
                e.target !==
                modal
              ) {
                return;
              }

              if (
                modal.id ===
                "hs-clear-modal"
              ) {
                closeClearModal();
              }

              if (
                modal.id ===
                "hs-note-modal"
              ) {
                closeNoteModal();
              }

              if (
                modal.id ===
                "hs-delete-modal"
              ) {
                closeDeleteModal();
              }
            }
          );
        }
      );


    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
            "visible" &&
          (
            !state.ws ||
            state.ws.readyState >
              1
          )
        ) {
          reconnectWebSocket();
        }

        if (
          document.visibilityState ===
          "visible"
        ) {
          loadState();
        }
      }
    );


    window.addEventListener(
      "online",
      reconnectWebSocket
    );
  }


  /* =========================
     HELPERS
  ========================= */

  function clamp(
    value,
    min,
    max
  ) {
    return Math.max(
      min,
      Math.min(
        max,
        Number(value) ||
        0
      )
    );
  }


  function escapeHtml(str) {
    return String(str).replace(
      /[&<>'"]/g,
      (ch) => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[ch])
    );
  }


  function cssEscape(value) {
    if (
      window.CSS &&
      CSS.escape
    ) {
      return CSS.escape(
        value
      );
    }

    return String(
      value
    ).replace(
      /[^a-zA-Z0-9_-]/g,
      "\\$&"
    );
  }


  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      init
    );
  }

  else {
    init();
  }

})();
</script>

<script>
(function() {
  var progress =
    document.getElementById(
      "scroll-progress"
    );

  function updateProgress() {
    var h =
      document.documentElement;

    var max =
      h.scrollHeight -
      h.clientHeight;

    var pct =
      max > 0
        ? (
            h.scrollTop /
            max
          ) *
          100
        : 0;

    progress.style.width =
      pct +
      "%";
  }

  window.addEventListener(
    "scroll",
    updateProgress,
    {passive:true}
  );

  window.addEventListener(
    "resize",
    updateProgress
  );

  updateProgress();


  var fadeItems =
    document.querySelectorAll(
      ".fade"
    );


  if (
    "IntersectionObserver"
    in window
  ) {
    var observer =
      new IntersectionObserver(
        function(entries) {
          entries.forEach(
            function(entry) {
              if (
                entry.isIntersecting
              ) {
                entry.target
                  .classList.add(
                    "visible"
                  );

                observer.unobserve(
                  entry.target
                );
              }
            }
          );
        },
        {
          threshold:.08,
          rootMargin:
            "0px 0px -3% 0px"
        }
      );


    fadeItems.forEach(
      function(el) {
        observer.observe(
          el
        );
      }
    );
  }

  else {
    fadeItems.forEach(
      function(el) {
        el.classList.add(
          "visible"
        );
      }
    );
  }

})();
</script>
