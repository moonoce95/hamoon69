<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hamoon</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0d0608;
  --pink:#f4b8cc;
  --gold:#e8b64c;
  --soft:rgba(244,184,204,.16);
  --line:rgba(255,255,255,.09);
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:#fdf0f5;
  font-family:Georgia,serif;
  overflow-x:hidden;
}

.curtain{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:200;
  animation:curtainLift .6s ease .5s forwards;
  pointer-events:none;
}

@keyframes curtainLift{
  to{
    opacity:0;
    visibility:hidden;
  }
}

.page{
  width:min(640px,calc(100% - 28px));
  margin:auto;
  padding:34px 0 120px;
}

.hello{
  text-align:center;
  color:var(--pink);
  font-size:1.55rem;
  margin:6px 0 26px;
}

.reveal{
  margin:36px 0;
  opacity:1;
  transform:none;
}

.media{
  display:block;
  width:100%;
  max-width:100%;
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(244,184,204,.12);
  box-shadow:0 10px 35px rgba(0,0,0,.28);
}

img.media,
video.media{
  height:auto;
}

.video-frame{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
  display:block;
}

.audio-wrap{
  margin:36px 0;
}

.audio-wrap audio{
  width:100%;
}

.final-text{
  text-align:center;
  color:var(--pink);
  font-size:1.15rem;
  margin:70px 0 28px;
}

.hs-memory-reactions{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  position:relative;
}

.hs-used-reaction,
.hs-react-open,
.hs-emoji{
  border:1px solid rgba(244,184,204,.18);
  background:rgba(244,184,204,.06);
  color:#fff;
  border-radius:999px;
  padding:5px 8px;
  cursor:pointer;
  font-family:inherit;
}

.hs-used-reaction.mine{
  border-color:rgba(232,182,76,.55);
}

.hs-react-open{
  color:var(--pink);
}

.hs-picker{
  display:none;
  position:absolute;
  left:0;
  top:38px;
  z-index:40;
  width:min(330px,calc(100vw - 40px));
  padding:9px;
  border-radius:12px;
  background:#160b0f;
  border:1px solid rgba(244,184,204,.18);
  box-shadow:0 12px 36px rgba(0,0,0,.45);
  flex-wrap:wrap;
  gap:5px;
}

.hs-picker.show{
  display:flex;
}

.hs-emoji{
  font-size:1.1rem;
  padding:6px 8px;
}

.hs-emoji.mine{
  border-color:var(--gold);
}

#hs-shared-uploads{
  margin:70px 0 50px;
}

.hs-upload-heading{
  color:var(--gold);
  text-align:center;
  margin-bottom:12px;
  font-size:1.2rem;
}

.hs-upload-sub{
  text-align:center;
  opacity:.55;
  font-size:.88rem;
  margin-bottom:16px;
}

.hs-add-memory{
  display:block;
  margin:0 auto 22px;
}

.hs-upload-list{
  display:flex;
  flex-direction:column;
  gap:26px;
}

.hs-upload-card{
  position:relative;
}

.hs-upload-card img,
.hs-upload-card video{
  width:100%;
  border-radius:12px;
  display:block;
}

.hs-upload-card audio{
  width:100%;
}

.hs-upload-caption{
  margin-top:8px;
  color:var(--pink);
  text-align:center;
  white-space:pre-wrap;
}

.hs-upload-tools{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:8px;
  flex-wrap:wrap;
}

.hs-btn{
  border:1px solid rgba(244,184,204,.18);
  background:rgba(244,184,204,.06);
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  font-family:inherit;
}

.hs-btn:hover,
.hs-btn.active{
  border-color:rgba(232,182,76,.6);
}

.hs-danger{
  color:#ffb3bd;
}

#hs-sticker-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:25;
}

.hs-sticker{
  position:absolute;
  pointer-events:auto;
  touch-action:none;
  user-select:none;
  transform-origin:center center;
}

.hs-sticker img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

.hs-sticker.selected{
  outline:1px dashed rgba(232,182,76,.8);
  outline-offset:3px;
}

.hs-sticker-handle{
  display:none;
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#160b0f;
  border:1px solid var(--gold);
  color:#fff;
  align-items:center;
  justify-content:center;
  font-size:12px;
  cursor:pointer;
  touch-action:none;
}

.hs-sticker.selected .hs-sticker-handle{
  display:flex;
}

.hs-sticker-delete{
  top:-13px;
  right:-13px;
}

.hs-sticker-resize{
  right:-13px;
  bottom:-13px;
  cursor:nwse-resize;
}

.hs-sticker-rotate{
  top:-34px;
  left:50%;
  transform:translateX(-50%);
  cursor:grab;
}

#hs-cursors{
  position:fixed;
  inset:0;
  z-index:180;
  pointer-events:none;
}

.hs-cursor{
  position:fixed;
  display:none;
  transform:translate(-5px,-5px);
  pointer-events:none;
}

.hs-cursor-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 3px rgba(232,182,76,.15);
}

.hs-cursor-label{
  position:absolute;
  left:10px;
  top:10px;
  padding:3px 6px;
  border-radius:6px;
  background:#160b0f;
  color:#fff;
  font-family:system-ui,sans-serif;
  font-size:11px;
  white-space:nowrap;
  border:1px solid rgba(244,184,204,.18);
}

#hs-pets{
  margin:65px auto 22px;
  position:relative;
  min-height:105px;
  border-radius:16px;
  border:1px solid rgba(244,184,204,.11);
  background:rgba(244,184,204,.025);
  overflow:hidden;
}

.hs-pet{
  position:absolute;
  bottom:10px;
  text-align:center;
  transition:left 1.2s ease,transform .35s ease;
  user-select:none;
  cursor:pointer;
}

.hs-pet-face{
  font-size:2.2rem;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.35));
}

.hs-pet-name{
  font-family:system-ui,sans-serif;
  font-size:.7rem;
  opacity:.55;
  margin-top:1px;
}

#hs-pet-andy{
  left:16%;
}

#hs-pet-hamy{
  left:72%;
}

#hs-pets.both #hs-pet-andy{
  left:42%;
}

#hs-pets.both #hs-pet-hamy{
  left:53%;
}

.hs-pet.boop{
  animation:petBoop .42s ease;
}

@keyframes petBoop{
  50%{
    transform:translateY(-10px) rotate(5deg);
  }
}

#hamoon-space{
  position:relative;
  width:min(900px,calc(100vw - 24px));
  margin:28px 50% 0;
  transform:translateX(-50%);
}

.hs-shell{
  border:1px solid rgba(244,184,204,.13);
  border-radius:16px;
  background:rgba(244,184,204,.025);
  padding:14px;
}

.hs-title{
  text-align:center;
  color:var(--gold);
  font-size:1.35rem;
  margin-bottom:8px;
}

.hs-who{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0;
  flex-wrap:wrap;
}

.hs-author{
  border:1px solid rgba(244,184,204,.18);
  color:#fff;
  background:rgba(244,184,204,.05);
  border-radius:999px;
  padding:7px 11px;
  cursor:pointer;
  font-family:inherit;
}

.hs-author.active{
  color:var(--gold);
  border-color:rgba(232,182,76,.6);
}

.hs-presence,
.hs-connection,
#hs-live-clock{
  text-align:center;
  font-family:system-ui,sans-serif;
  font-size:.78rem;
}

.hs-presence{
  color:var(--pink);
  opacity:.8;
  margin-top:7px;
}

.hs-connection{
  margin-top:3px;
  opacity:.72;
}

#hs-live-clock{
  margin-top:3px;
  opacity:.43;
  font-size:.7rem;
}

.hs-tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:13px 0 10px;
}

.hs-colour{
  width:34px;
  height:34px;
  border-radius:50%;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
}

.hs-colour::-webkit-color-swatch-wrapper{
  padding:0;
}

.hs-colour::-webkit-color-swatch{
  border:2px solid rgba(255,255,255,.45);
  border-radius:50%;
}

.hs-size{
  width:120px;
}

.hs-canvas-wrap{
  position:relative;
  width:100%;
  aspect-ratio:2/3;
  border-radius:12px;
  overflow:hidden;
  background:#fbf5f0;
  border:1px solid rgba(0,0,0,.08);
}

#hs-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:none;
}

.hs-tool-preview{
  position:fixed;
  display:none;
  pointer-events:none;
  z-index:190;
  border:1.5px solid rgba(25,15,18,.65);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.mode-erase .hs-tool-preview{
  border-style:dashed;
}

.hs-selection{
  display:none;
  position:absolute;
  border:1.5px dashed #e8b64c;
  background:rgba(232,182,76,.08);
  pointer-events:none;
  z-index:10;
}

.hs-selection.show{
  display:block;
}

.hs-history{
  display:none;
  margin-top:12px;
  border-top:1px solid rgba(244,184,204,.11);
  padding-top:12px;
}

.hs-snap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-family:system-ui,sans-serif;
  font-size:.78rem;
}

.hs-history-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}

.hs-toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%) translateY(15px);
  background:#160b0f;
  color:#fff;
  border:1px solid rgba(244,184,204,.18);
  border-radius:999px;
  padding:8px 13px;
  z-index:300;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
  font-family:system-ui,sans-serif;
  font-size:.78rem;
}

.hs-toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.hs-modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.hs-modal.show{
  display:flex;
}

.hs-modal-card{
  width:min(430px,100%);
  border:1px solid rgba(244,184,204,.18);
  border-radius:15px;
  padding:18px;
  background:#160b0f;
  box-shadow:0 18px 55px rgba(0,0,0,.5);
}

.hs-modal-card h3{
  color:var(--gold);
  margin-bottom:8px;
}

.hs-modal-card p{
  font-family:system-ui,sans-serif;
  font-size:.9rem;
  opacity:.78;
  margin-bottom:12px;
}

.hs-modal-card input,
.hs-modal-card textarea,
.hs-modal-card select{
  width:100%;
  background:#0d0608;
  border:1px solid rgba(244,184,204,.18);
  color:#fff;
  border-radius:9px;
  padding:10px;
  margin:6px 0;
  font-family:inherit;
}

.hs-modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.hs-file-input{
  display:none;
}

@media(max-width:640px){
  .page{
    width:min(100% - 20px,640px);
  }

  .hs-shell{
    padding:10px;
  }

  .hs-size{
    width:95px;
  }

  .hs-sticker-handle{
    width:30px;
    height:30px;
  }

  .hs-sticker-delete{
    top:-15px;
    right:-15px;
  }

  .hs-sticker-resize{
    right:-15px;
    bottom:-15px;
  }

  .hs-sticker-rotate{
    top:-39px;
  }
}

</style>
</head>

  function detectAuthor(){
    const tz=
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone ||
      "";

    const lang=
      (
        navigator.language ||
        ""
      ).toLowerCase();

    if(
      tz==="Pacific/Auckland" ||
      tz==="Pacific/Chatham" ||
      lang.endsWith("-nz")
    ){
      return "Hamy";
    }

    if(
      tz==="Australia/Melbourne" ||
      tz.startsWith("Australia/") ||
      lang.endsWith("-au")
    ){
      return "Andy";
    }

    return "Andy";
  }

  function headers(auth=true){
    const h={
      "Content-Type":"application/json"
    };

    if(
      auth &&
      state.token
    ){
      h.Authorization=
        "Bearer "+
        state.token;
    }

    return h;
  }

  async function api(
    path,
    options={}
  ){
    const res=
      await fetch(
        API+path,
        options
      );

    if(!res.ok){
      let text="";

      try{
        text=
          await res.text();
      }catch(_){}

      throw new Error(
        text ||
        ("HTTP "+res.status)
      );
    }

    const type=
      res.headers.get(
        "content-type"
      ) ||
      "";

    if(
      type.includes(
        "application/json"
      )
    ){
      return res.json();
    }

    return res.text();
  }

      id:s.id,

  function brushWidth(
    width
  ){
    return Math.max(
      1,
      Number(width)
    );
  }

  function resizeCanvas(){
    const rect=
      canvas.getBoundingClientRect();

    state.dpr=
      Math.max(
        1,
        window.devicePixelRatio ||
        1
      );

    state.width=
      rect.width;

    state.height=
      rect.height;

    canvas.width=
      Math.round(
        rect.width *
        state.dpr
      );

    canvas.height=
      Math.round(
        rect.height *
        state.dpr
      );

    ctx.setTransform(
      state.dpr,
      0,
      0,
      state.dpr,
      0,
      0
    );

    redraw();
  }

  function drawStroke(
    stroke
  ){
    const points=
      stroke.points ||
      [];

    if(
      !points.length
    ){
      return;
    }

    ctx.strokeStyle=
      stroke.color;

    ctx.lineWidth=
      brushWidth(
        stroke.width
      );

    ctx.lineCap=
      "round";

    ctx.lineJoin=
      "round";

    if(
      points.length ===
      1
    ){
      ctx.beginPath();

      ctx.arc(
        points[0].x *
          state.width,
        points[0].y *
          state.height,
        Math.max(
          1,
          ctx.lineWidth /
          2
        ),
        0,
        Math.PI *
          2
      );

      ctx.fillStyle=
        stroke.color;

      ctx.fill();

      return;
    }

    ctx.beginPath();

    ctx.moveTo(
      points[0].x *
        state.width,
      points[0].y *
        state.height
    );

    for(
      let i=1;
      i<points.length;
      i++
    ){
      ctx.lineTo(
        points[i].x *
          state.width,
        points[i].y *
          state.height
      );
    }

    ctx.stroke();
  }

  function redraw(){
    ctx.clearRect(
      0,
      0,
      state.width,
      state.height
    );

    for(
      const stroke
      of state.strokes
    ){
      drawStroke(
        stroke
      );
    }
  }

  function point(e){
    const rect=
      canvas.getBoundingClientRect();

    return {
      x:
        Math.max(
          0,
          Math.min(
            1,
            (
              e.clientX -
              rect.left
            ) /
            Math.max(
              rect.width,
              1
            )
          )
        ),

      y:
        Math.max(
          0,
          Math.min(
            1,
            (
              e.clientY -
              rect.top
            ) /
            Math.max(
              rect.height,
              1
            )
          )
        )
    };
  }

  function eraserDiameterPx(){
    return Math.max(
      12,
      state.thickness *
      2.8
    );
  }

  function eraserRadiusNorm(){
    return (
      eraserDiameterPx() /
      2
    ) /
    Math.max(
      1,
      state.width
    );
  }

  function previewDiameterPx(){
    return state.mode ===
      "erase"
      ? eraserDiameterPx()
      : Math.max(
          4,
          brushWidth(
            state.thickness
          )
        );
  }

  function showToolPreview(
    clientX,

  ){

    toolPreview.style.display=

    toolPreview.style.left=

    toolPreview.style.width=

    toolPreview.style.height=

    toolPreview.style.borderStyle=

        "erase"
        ? "dashed"
        : "solid";

  function hideToolPreview(){
    toolPreview.style.display=
      "none";
  }

  function touchCentreY(){
    const vals=
      Array.from(
        state.activeTouches.values()
      );

    if(!vals.length){
      return 0;
    }

    return vals.reduce(
      (
        sum,
        p
      ) =>
        sum +
        p.y,
      0
    ) /
    vals.length;
  }

  function pointerDown(e){
    if(
      !state.token
    ){
      return;
    }

    if(
      state.stickerSelect
    ){
      e.preventDefault();

      const r=
        canvas.getBoundingClientRect();

      state.selectionStart={
        x:
          e.clientX -
          r.left,

        y:
          e.clientY -
          r.top
      };

      state.selectionNow={
        ...state.selectionStart
      };

      updateSelectionBox();

      return;
    }

    if(
      e.pointerType ===
      "touch"
    ){
      state.activeTouches.set(
        e.pointerId,
        {
          x:e.clientX,
          y:e.clientY
        }
      );

      if(
        state.activeTouches.size >=
        2
      ){
        state.twoFingerScroll=
          true;

        state.touchScrollStartY=
          touchCentreY();

        state.pageScrollStartY=
          window.scrollY;

        state.drawing=
          false;

        state.current=
          null;

        return;
      }
    }

    showToolPreview(
      e.clientX,
      e.clientY
    );

    const p=
      point(e);

    if(
      state.mode ===
      "erase"
    ){
      e.preventDefault();

      erase(p);

      return;
    }

    e.preventDefault();

    state.drawing=
      true;

    state.current={
      id:
        crypto.randomUUID(),

      author:
        state.author,

      color:
        state.colour,

      width:
        state.thickness,

      points:[
        p
      ]
    };

    ctx.fillStyle=
      state.colour;

    ctx.beginPath();

    ctx.arc(
      p.x *
        state.width,
      p.y *
        state.height,
      Math.max(
        1,
        state.thickness /
        2
      ),
      0,
      Math.PI *
        2
    );

    ctx.fill();
  }

  function updateSelectionBox(){
    if(
      !state.selectionStart ||
      !state.selectionNow
    ){
      selectionBox.classList.remove(
        "show"
      );

      return;
    }

    const left=
      Math.min(
        state.selectionStart.x,
        state.selectionNow.x
      );

    const top=
      Math.min(
        state.selectionStart.y,
        state.selectionNow.y
      );

    const width=
      Math.abs(
        state.selectionNow.x -
        state.selectionStart.x
      );

    const height=
      Math.abs(
        state.selectionNow.y -
        state.selectionStart.y
      );

    selectionBox.style.left=
      left +
      "px";

    selectionBox.style.top=
      top +
      "px";

    selectionBox.style.width=
      width +
      "px";

    selectionBox.style.height=
      height +
      "px";

    selectionBox.classList.add(
      "show"
    );
  }

  function pointerMove(e){
    if(
      !state.token
    ){
      return;
    }

    if(
      state.stickerSelect &&
      state.selectionStart
    ){
      e.preventDefault();

      const r=
        canvas.getBoundingClientRect();

      state.selectionNow={
        x:
          Math.max(
            0,
            Math.min(
              r.width,
              e.clientX -
              r.left
            )
          ),

        y:
          Math.max(
            0,
            Math.min(
              r.height,
              e.clientY -
              r.top
            )
          )
      };

      updateSelectionBox();

      return;
    }

    if(
      e.pointerType ===
      "touch" &&
      state.activeTouches.has(
        e.pointerId
      )
    ){
      state.activeTouches.set(
        e.pointerId,
        {
          x:e.clientX,
          y:e.clientY
        }
      );

      if(
        state.twoFingerScroll
      ){
        e.preventDefault();

        window.scrollTo(
          0,
          state.pageScrollStartY +
          (
            state.touchScrollStartY -
            touchCentreY()
          )
        );

        return;
      }
    }

    showToolPreview(
      e.clientX,
      e.clientY
    );

    const p=
      point(e);

    if(
      state.mode ===
        "draw" &&
      state.drawing &&
      state.current
    ){
      e.preventDefault();

      const pts=
        state.current.points;

      const last=
        pts[
          pts.length -
          1
        ];

      const dx=
        p.x -
        last.x;

      const dy=
        p.y -
        last.y;

      if(
        dx *
          dx +
        dy *
          dy <
        .0000015
      ){
        return;
      }

      pts.push(
        p
      );

      ctx.strokeStyle=
        state.current.color;

      ctx.lineWidth=
        brushWidth(
          state.current.width
        );

      ctx.lineCap=
        "round";

      ctx.lineJoin=
        "round";

      ctx.beginPath();

      ctx.moveTo(
        last.x *
          state.width,
        last.y *
          state.height
      );

      ctx.lineTo(
        p.x *
          state.width,
        p.y *
          state.height
      );

      ctx.stroke();

    }else if(
      state.mode ===
      "erase"
    ){
      /*
        Desktop mouse hover is preview only.
        Left button must be held to erase.
      */
      if(
        e.pointerType ===
          "mouse" &&
        e.buttons !==
          1
      ){
        return;
      }

      e.preventDefault();

      erase(p);
    }
  }

  async function finishStickerSelection(){
    if(
      !state.selectionStart ||
      !state.selectionNow
    ){
      return;
    }

    const left=
      Math.min(
        state.selectionStart.x,
        state.selectionNow.x
      );

    const top=
      Math.min(
        state.selectionStart.y,
        state.selectionNow.y
      );

    const width=
      Math.abs(
        state.selectionNow.x -
        state.selectionStart.x
      );

    const height=
      Math.abs(
        state.selectionNow.y -
        state.selectionStart.y
      );

    state.selectionStart=
      null;

    state.selectionNow=
      null;

    state.stickerSelect=
      false;

    selectionBox.classList.remove(
      "show"
    );

    document
      .getElementById(
        "hs-make-sticker"
      )
      .classList.remove(
        "active"
      );

    if(
      width <
        18 ||
      height <
        18
    ){
      toast(
        "select a bigger bit"
      );

      return;
    }

    const c=
      document.createElement(
        "canvas"
      );

    const scale=
      Math.min(
        2,
        700 /
        Math.max(
          width,
          height
        )
      );

    c.width=
      Math.max(
        1,
        Math.round(
          width *
          scale
        )
      );

    c.height=
      Math.max(
        1,
        Math.round(
          height *
          scale
        )
      );

    const x=
      c.getContext(
        "2d"
      );

    x.drawImage(
      canvas,

      left *
        state.dpr,

      top *
        state.dpr,

      width *
        state.dpr,

      height *
        state.dpr,

      0,
      0,
      c.width,
      c.height
    );

    const src=
      c.toDataURL(
        "image/webp",
        .9
      );

    const widthNorm=
      Math.max(
        .055,
        Math.min(
          .25,
          width /
          Math.max(
            document.documentElement.scrollWidth,
            1
          )
        )
      );

    const heightNorm=
      Math.max(
        .04,
        Math.min(
          .32,
          widthNorm *
          (
            height /
            width
          )
        )
      );

    const spot=
      firstStickerSpot(
        widthNorm,
        heightNorm
      );

    try{
      await api(
        "/space/sticker",
        {
          method:"POST",
          headers:
            headers(true),

          body:
            JSON.stringify({
              id:
                crypto.randomUUID(),

              author:
                state.author,

              src,

              x:
                spot.x,

              y:
                spot.y,

              width:
                widthNorm,

              height:
                heightNorm,

              rotation:
                0
            })
        }
      );

      toast(
        "doodle sticker made ✨"
      );

      loadState();

    }catch(_){
      toast(
        "sticker didn't save"
      );
    }
  }

  function pointerUp(e){
    if(
      state.stickerSelect &&
      state.selectionStart
    ){
      finishStickerSelection();
      return;
    }

    if(
      e.pointerType ===
      "touch"
    ){
      hideToolPreview();

      state.activeTouches.delete(
        e.pointerId
      );

      if(
        state.twoFingerScroll
      ){
        if(
          state.activeTouches.size ===
          0
        ){
          state.twoFingerScroll=
            false;
        }

        return;
      }
    }

    if(
      !state.drawing ||
      !state.current
    ){
      return;
    }

    state.drawing=
      false;

    const stroke=
      state.current;

    state.current=
      null;

    state.strokes.push(
      stroke
    );

    redraw();

    api(
      "/space/stroke",
      {
        method:"POST",
        headers:
          headers(true),

        body:
          JSON.stringify(
            stroke
          )
      }
    )
      .catch(
        ()=>{
          toast(
            "stroke didn't save 😭"
          );

          loadState()
            .catch(
              ()=>{}
            );
        }
      );
  }

  function erase(p){
    const now=
      Date.now();

    if(
      now -
      state.eraseAt <
      55
    ){
      return;
    }

    state.eraseAt=
      now;

    api(
      "/space/erase-segment",
      {
        method:"POST",
        headers:
          headers(true),

        body:
          JSON.stringify({
            x:
              p.x,

            y:
              p.y,

            radius:
              eraserRadiusNorm(),

            author:
              state.author
          })
      }
    )
      .then(
        loadState
      )
      .catch(
        ()=>{
          toast(
            "rubber failed"
          );
        }
      );
  }

  canvas.addEventListener(
    "pointerdown",
    pointerDown
  );

  canvas.addEventListener(
    "pointermove",
    pointerMove
  );

  canvas.addEventListener(
    "pointerup",
    pointerUp
  );

  canvas.addEventListener(
    "pointercancel",

  function buildReactionBar(
    bar,
    memoryId
  ){
    bar.innerHTML=
      "";

    const rows=
      state.reactions.filter(
        r =>
          r.memoryId ===
          memoryId
      );

    const counts=
      new Map();

    rows.forEach(
      r =>
        counts.set(
          r.emoji,
          (
            counts.get(
              r.emoji
            ) ||
            0
          ) +
          1
        )
    );

    EMOJIS.forEach(
      emoji=>{
        const count=
          counts.get(
            emoji
          ) ||
          0;

        if(!count){
          return;
        }

        const mine=
          rows.some(
            r =>
              r.author ===
                state.author &&
              r.emoji ===
                emoji
          );

        const b=
          document.createElement(
            "button"
          );

        b.className=
          "hs-used-reaction"+
          (
            mine
              ? " mine"
              : ""
          );

        b.textContent=
          emoji+
          " "+
          count;

        b.addEventListener(
          "click",
          () =>
            toggleReaction(
              memoryId,
              emoji
            )
        );

        bar.appendChild(
          b
        );
      }
    );

    const open=
      document.createElement(
        "button"
      );

    open.className=
      "hs-react-open";

    open.textContent=
      "react";

    bar.appendChild(
      open
    );

    const picker=
      document.createElement(
        "div"
      );

    picker.className=
      "hs-picker";

    EMOJIS.forEach(
      emoji=>{
        const mine=
          rows.some(
            r =>
              r.author ===
                state.author &&
              r.emoji ===
                emoji
          );

        const b=
          document.createElement(
            "button"
          );

        b.className=
          "hs-emoji"+
          (
            mine
              ? " mine"
              : ""
          );

        b.textContent=
          emoji;

        b.addEventListener(
          "click",
          () =>
            toggleReaction(
              memoryId,
              emoji
            )
        );

        picker.appendChild(
          b
        );
      }
    );

    open.addEventListener(
      "click",
      () =>
        picker.classList.toggle(
          "show"
        )
    );

    bar.appendChild(
      picker
    );
  }

  function toggleReaction(
    memoryId,
    emoji
  ){
    const idx=
      state.reactions.findIndex(
        r =>
          r.memoryId ===
            memoryId &&
          r.author ===
            state.author &&
          r.emoji ===
            emoji
      );

    if(
      idx >=
      0

      state.reactions.splice(
        idx,
        1
      );

    }else{
      state.reactions.push({
        memoryId,
        author:
          state.author,
        emoji

    renderReactions();

    api(

        method:"POST",
        headers:

        body:

            memoryId,
            author:

        ()=>{

  }

  function sendCursor(
    e
  ){
    if(
      !state.ws ||
      state.ws.readyState !==
        WebSocket.OPEN
    ){
      return;
    }

    const now=
      Date.now();

    if(
      now -
      state.cursorAt <
      35
    ){
      return;
    }

    state.cursorAt=
      now;

    try{
      state.ws.send(
        JSON.stringify({
          type:
            "cursor",

          x:
            e.clientX /
            Math.max(
              1,
              window.innerWidth
            ),

          y:
            e.clientY /
            Math.max(
              1,
              window.innerHeight
            ),

          active:
            true
        })
      );
    }catch(_){}
  }

  window.addEventListener(
    "pointermove",
    sendCursor,
    {
      passive:true
    }
  );

  window.addEventListener(
    "pointerout",
    e=>{
      if(
        e.relatedTarget
      ){
        return;
      }

      if(
        !state.ws ||
        state.ws.readyState !==
          WebSocket.OPEN
      ){
        return;
      }

      try{
        state.ws.send(
          JSON.stringify({
            type:

          })
        );
      }catch(_){}
    }
  );

  /* ---------- sticker safe zones ---------- */

  function pageRect(
    el
  ){
    const r=
      el.getBoundingClientRect();

    return {
      left:
        r.left +
        window.scrollX,

      top:
        r.top +
        window.scrollY,

      right:
        r.right +
        window.scrollX,

      bottom:
        r.bottom +
        window.scrollY
    };
  }

  function safeRects(){
    const selectors=[
      ".video-frame",
      ".media",
      ".audio-wrap",
      "#hamoon-space",
      ".hello"
    ];

    return Array.from(
      document.querySelectorAll(
        selectors.join(
          ","
        )
      )
    ).map(
      pageRect
    );
  }

  function rotatedBounds(
    x,
    y,
    w,
    h,
    rotation
  ){
    const rad=
      rotation *
      Math.PI /
      180;

    const c=
      Math.abs(
        Math.cos(
          rad
        )
      );

    const s=
      Math.abs(
        Math.sin(
          rad
        )
      );

    const rw=
      w *
        c +
      h *
        s;

    const rh=
      w *
        s +
      h *
        c;

    return {
      left:
        x -
        rw /
        2,

      top:
        y -
        rh /
        2,

      right:
        x +
        rw /
        2,

      bottom:
        y +
        rh /
        2
    };
  }

  function intersects(
    a,
    b,
    padding=8
  ){
    return !(
      a.right <
        b.left -
        padding ||
      a.left >
        b.right +
        padding ||
      a.bottom <
        b.top -
        padding ||
      a.top >
        b.bottom +
        padding
    );
  }

  function stickerPixelState(
    sticker
  ){
    const docW=
      Math.max(
        document.documentElement.scrollWidth,
        window.innerWidth
      );

    const docH=
      Math.max(
        document.documentElement.scrollHeight,
        window.innerHeight
      );

    return {
      cx:
        sticker.x *
        docW,

      cy:
        sticker.y *
        docH,

      w:
        sticker.width *
        docW,

      h:
        sticker.height *
        docH,

      rotation:
        sticker.rotation
    };
  }

  function validStickerGeometry(
    cx,
    cy,
    w,
    h,
    rotation
  ){
    if(
      w <
        35 ||
      h <
        35
    ){
      return false;
    }

    const docW=
      Math.max(
        document.documentElement.scrollWidth,
        window.innerWidth
      );

    const docH=
      Math.max(
        document.documentElement.scrollHeight,
        window.innerHeight
      );

    const bounds=
      rotatedBounds(
        cx,
        cy,
        w,
        h,
        rotation
      );

    if(
      bounds.left <
        5 ||
      bounds.top <
        5 ||
      bounds.right >
        docW -
        5 ||
      bounds.bottom >
        docH -
        5
    ){
      return false;
    }

    for(
      const protectedRect
      of safeRects()
    ){
      if(
        intersects(
          bounds,
          protectedRect,
          7
        )
      ){
        return false;
      }
    }

    return true;
  }

  function firstStickerSpot(
    widthNorm,
    heightNorm
  ){
    const docW=
      Math.max(
        document.documentElement.scrollWidth,
        window.innerWidth
      );

    const docH=
      Math.max(
        document.documentElement.scrollHeight,
        window.innerHeight
      );

    const w=
      widthNorm *
      docW;

    const h=
      heightNorm *
      docH;

    const candidates=[
      {
        x:.08,
        y:.13
      },
      {
        x:.91,
        y:.16
      },
      {
        x:.08,
        y:.35
      },
      {
        x:.91,
        y:.38
      },
      {
        x:.08,
        y:.6
      },
      {
        x:.91,
        y:.62
      },
      {
        x:.1,
        y:.8
      },
      {
        x:.9,
        y:.82
      }
    ];

    for(
      const c
      of candidates
    ){
      const cx=
        c.x *
        docW;

      const cy=
        c.y *
        docH;

      if(
        validStickerGeometry(
          cx,
          cy,
          w,
          h,
          0
        )
      ){
        return {
          x:c.x,
          y:c.y
        };
      }
    }

    return {
      x:.08,
      y:.72
    };
  }

  window.addEventListener(
    "pointermove",
    e=>{
      const drag=
        state.stickerDrag;

      if(
        !drag ||
        drag.pointerId !==
        e.pointerId
      ){
        return;
      }

      const sticker=
        state.stickers.find(
          s =>
            s.id ===
            state.selectedSticker
        );

      if(!sticker){
        return;
      }

      e.preventDefault();

      const docW=
        Math.max(
          document.documentElement.scrollWidth,
          window.innerWidth
        );

      const docH=
        Math.max(
          document.documentElement.scrollHeight,
          window.innerHeight
        );

      let cx=
        drag.original.cx;

      let cy=
        drag.original.cy;

      let w=
        drag.original.w;

      let h=
        drag.original.h;

      let rotation=
        drag.original.rotation;

      if(
        drag.type ===
        "move"
      ){
        cx=
          drag.original.cx +
          (
            e.clientX -
            drag.startX
          );

        cy=
          drag.original.cy +
          (
            e.clientY -
            drag.startY
          );
      }

      if(
        drag.type ===
        "resize"
      ){
        const dx=
          e.clientX -
          drag.startX;

        const dy=
          e.clientY -
          drag.startY;

        const factor=
          Math.max(
            .2,
            1 +
            (
              dx +
              dy
            ) /
            220
          );

        w=
          drag.original.w *
          factor;

        h=
          drag.original.h *
          factor;
      }

      if(
        drag.type ===
        "rotate"
      ){
        const pageX=
          e.clientX +
          window.scrollX;

        const pageY=
          e.clientY +
          window.scrollY;

        rotation=
          Math.atan2(
            pageY -
            drag.original.cy,
            pageX -
            drag.original.cx
          ) *
          180 /
          Math.PI +
          90;
      }

      if(
        !validStickerGeometry(
          cx,
          cy,
          w,
          h,
          rotation
        )
      ){
        return;
      }

      sticker.x=
        cx /
        docW;

      sticker.y=
        cy /
        docH;

      sticker.width=
        w /
        docW;

      sticker.height=
        h /
        docH;

      sticker.rotation=
        rotation;

      renderStickers();

      const el=
        stickerLayer.querySelector(
          '[data-id="'+
          sticker.id+
          '"]'
        );

      if(el){
        el.classList.add(
          "selected"
        );
      }
    },
    {
      passive:false
    }
  );

  /*
    At this stage we use Data URLs so photos/stickers work
    without Hamy touching GitHub.

    Keep image uploads reasonably small.
    Larger video/audio storage should later be moved to R2.
  */
  function fileToDataURL(
    file
  ){
    return new Promise(
      (
        resolve,
        reject
      )=>{
        const reader=
          new FileReader();

        reader.onload=
          () =>
            resolve(
              reader.result
            );

        reader.onerror=
          reject;

        reader.readAsDataURL(
          file
        );
      }
    );
  }

        if(

          1024

          return;

        let src;

        try{

          return;

        const use=

  async function moveUpload(
    item,
    direction
  ){
    const ordered=
      state.uploads
        .slice()
        .sort(
          (
            a,
            b
          ) =>
            a.sortOrder -
            b.sortOrder
        );

    const index=
      ordered.findIndex(
        x =>
          x.id ===
          item.id
      );

    const targetIndex=
      index +
      direction;

    if(
      index <
        0 ||
      targetIndex <
        0 ||
      targetIndex >=
        ordered.length
    ){
      return;
    }

    const other=
      ordered[
        targetIndex
      ];

    const a=
      item.sortOrder;

    item.sortOrder=
      other.sortOrder;

    other.sortOrder=
      a;

    try{
      await Promise.all([
        api(
          "/space/upload",
          {
            method:"PUT",
            headers:
              headers(true),

            body:
              JSON.stringify({
                id:
                  item.id,

                author:
                  item.author,

                sortOrder:
                  item.sortOrder
              })
          }
        ),

        api(
          "/space/upload",
          {
            method:"PUT",
            headers:
              headers(true),

            body:
              JSON.stringify({
                id:
                  other.id,

                author:
                  other.author,

                sortOrder:
                  other.sortOrder
              })
          }
        )
      ]);

      loadState();

    }catch(_){
      toast(
        "move failed"
      );
    }
  }

  /* ---------- websocket ---------- */

  function wsUrl(){
    const q=
      new URLSearchParams({
        author:
          state.author,

        token:
          state.token
      });

    return (
      WS_URL+
      "?"+
      q.toString()
    );
  }

  function connectWebSocket(){
    if(
      !state.token ||
      !state.author
    ){
      return;
    }

    closeCurrentSocket();

    const ws=
      new WebSocket(
        wsUrl()
      );

    state.ws=
      ws;

    document
      .getElementById(
        "hs-conn-status"
      )
      .textContent=
        "connecting…";

    ws.onopen=
      ()=>{
        if(
          state.ws !==
          ws
        ){
          return;
        }

        state.reconnectAttempt=
          0;

        const status=
          document.getElementById(
            "hs-conn-status"
          );

        status.textContent=
          "● connected";

        status.style.color=
          "#75db9a";

        loadState()
          .catch(
            ()=>{}
          );
      };

    ws.onmessage=
      e=>{
        if(
          state.ws !==
          ws
        ){
          return;
        }

        let msg;

        try{
          msg=
            JSON.parse(
              e.data
            );

        }catch(_){
          return;
        }

        if(
          msg.type ===
          "init"
        ){
          const s=
            msg.state ||
            {};

          state.strokes=
            (
              s.strokes ||
              []
            )
              .map(
                normStroke
              )
              .filter(
                Boolean
              );

          state.reactions=
            (
              s.reactions ||
              []
            )
              .map(
                normReaction
              )
              .filter(
                Boolean
              );

          state.stickers=
            (
              s.stickers ||
              []
            )
              .map(
                normSticker
              )
              .filter(
                Boolean
              );

          state.uploads=
            (
              s.uploads ||
              []
            )
              .map(
                normUpload
              )
              .filter(
                Boolean
              );

          state.presence=
            Array.isArray(
              s.presence
            )
              ? s.presence
              : [];

          redraw();
          renderReactions();
          renderPresence();
          renderPets();
          renderStickers();
          renderUploads();

          return;
        }

        if(
          msg.type ===
          "presence"
        ){
          state.presence=
            msg.present ||
            msg.presence ||
            [];

          renderPresence();
          renderPets();

          return;
        }

        if(
          msg.type ===
          "cursor"
        ){
          if(
            msg.active ===
            false
          ){
            const el=
              cursorElement(
                msg.author
              );

            if(el){
              el.style.display=
                "none";
            }

          }else{
            showRemoteCursor(
              msg.author,
              msg.x,
              msg.y
            );
          }

          return;
        }

        if(
          msg.type ===
          "cursor.leave"
        ){
          const el=
            cursorElement(
              msg.author
            );

          if(el){
            el.style.display=
              "none";
          }

          return;
        }

        if(
          msg.type ===
            "sticker.added" ||
          msg.type ===
            "sticker.updated" ||
          msg.type ===
            "sticker.deleted" ||
          msg.type ===
            "upload.added" ||
          msg.type ===
            "upload.updated" ||
          msg.type ===
            "upload.deleted"
        ){
          loadState()
            .catch(
              ()=>{}
            );

          return;
        }

        if(
          msg.type ===
            "stroke" ||
          msg.type ===
            "stroke.added"
        ){
          const s=
            normStroke(
              msg.stroke
            );

          if(
            s &&
            !state.strokes.some(
              x =>
                x.id ===
                s.id
            )
          ){
            state.strokes.push(
              s
            );

            drawStroke(
              s
            );
          }

          return;
        }

        if(
          msg.type ===
            "erase" ||
          msg.type ===
            "erase-batch" ||
          msg.type ===
            "stroke.erased" ||
          msg.type ===
            "erase.segment" ||
          msg.type ===
            "stroke.segment.erased" ||
          msg.type ===
            "author.cleared" ||
          msg.type ===
            "restore" ||
          msg.type ===
            "restore_stroke" ||
          msg.type ===
            "board.restored"
        ){
          loadState()
            .catch(
              ()=>{}
            );

          return;
        }

        if(
          msg.type ===
            "clear" ||
          msg.type ===
            "board.cleared"
        ){
          state.strokes=
            [];

          redraw();

          return;
        }

        if(
          msg.type ===
            "reaction" ||
          msg.type ===
            "reaction.updated"
        ){
          loadState()
            .catch(
              ()=>{}
            );
        }
      };

    ws.onerror=
      ()=>{};

    ws.onclose=
      ()=>{
        if(
          state.ws !==
          ws
        ){
          return;
        }

        state.ws=
          null;

        const status=
          document.getElementById(
            "hs-conn-status"
          );

        status.style.color=
          "";

        status.textContent=
          "reconnecting…";

        const delay=
          Math.min(
            15000,
            900 *
            Math.pow(
              2,
              Math.min(
                state.reconnectAttempt++,
                4
              )
            )
          );

        clearTimeout(
          state.reconnectTimer
        );

        state.reconnectTimer=
          setTimeout(
            connectWebSocket,
            delay
          );
      };
  }

  document
    .querySelectorAll(
      ".hs-author"
    )
    .forEach(
      btn=>{
        btn.addEventListener(
          "click",
          () =>
            chooseAuthor(
              btn.dataset.author,
              true
            )
        );
      }
    );

  async function start(){
    state.detectedAuthor=
      detectAuthor();

    state.author=
      state.detectedAuthor;

    updateAuthorUI();

    renderPresence();

    resizeCanvas();

    renderStickers();

    window.addEventListener(
      "resize",
      ()=>{
        resizeCanvas();
        renderStickers();
      },
      {
        passive:true
      }
    );

    try{
      await autoUnlock();

      await loadState();

      connectWebSocket();

    }catch(err){
      document
        .getElementById(
          "hs-conn-status"
        )
        .textContent=
          "wall couldn't unlock 😭";

      toast(
        "wall setup failed"
      );

      console.error(
        err
      );
    }
  }

  document.addEventListener(
    "visibilitychange",
    ()=>{
      if(
        document.visibilityState !==
        "visible"
      ){
        return;
      }

      loadState()
        .catch(
          ()=>{}
        );

      if(
        !state.ws ||
        state.ws.readyState >
        1
      ){
        connectWebSocket();
      }
    }
  );

  window.addEventListener(
    "online",
    ()=>{
      if(
        !state.ws ||
        state.ws.readyState >
        1
      ){
        connectWebSocket();
      }
    }
  );

  start();

})();
</script>

</body>
</html>
