  .progress-fill{

  body::before{

    inset:0;
    background:

        rgba(244,184,204,.05),
        transparent 40%

    z-index:0;

<script>
/* ============================================================
   ORIGINAL PAGE EFFECTS
   ============================================================ */

const revealEls = document.querySelectorAll(
  '.reveal, .finale-lead, .audio-wrap'
);

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
    }
  });
},{
  threshold:0.08
});

revealEls.forEach((element) => {
  observer.observe(element);
});

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;

  const docHeight =
    document.documentElement.scrollHeight -
    window.innerHeight;

  const percentage =
    docHeight > 0
      ? (scrollTop / docHeight) * 100
      : 0;

  document.getElementById('progressFill').style.width =
    percentage + '%';
});

/* Force the first visit/reload to the TOP. */
window.addEventListener("load", () => {
  setTimeout(() => window.scrollTo(0, 0), 0);
}, { once:true });


/* ============================================================
   COLLABORATIVE WALL + REACTIONS
   ============================================================ */

(function(){
  "use strict";

  const API = "https://hamoon-counter.andy-ng199507.workers.dev";
  const WS_URL = "wss://hamoon-counter.andy-ng199507.workers.dev/space/live";

  /*
    Auto-unlock means the shared PIN is necessarily present in the page source.
    That's intentional here because this is a trusted two-person page.
  */
  const AUTO_EDIT_PIN = "hamoon-69";

  const EMOJIS = [
    "❤️","♡","💛","😂","😭","💀","🥹","🥺","😍","🤭",
    "😳","🫠","😤","🤡","🫡","🔥","✨","🌙","🌸","🐱"
  ];

  const canvas = document.getElementById("hs-canvas");
  const wrap = document.getElementById("hs-canvas-wrap");
  const ctx = canvas.getContext("2d");

  const state = {
    token:null,
    author:null,
    unlocked:false,
    mode:"move",
    colour:"#f4b8cc",
    thickness:3,
    strokes:[],
    reactions:[],
    presence:[],
    width:1,
    height:1,
    dpr:1,
    drawing:false,
    current:null,
    ws:null,
    reconnectTimer:null,
    reconnectAttempt:0,
    eraseAt:0
  };

  let toastTimer = null;

  function toast(text){
    const el = document.getElementById("hs-toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function detectAuthor(){
    let timezone = "";
    let language = "";

    try{
      timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    }catch(_){}

    try{
      language = (navigator.language || "").toLowerCase();
    }catch(_){}

    /* NZ device/timezone => Hamy */
    if(
      timezone === "Pacific/Auckland" ||
      timezone === "Pacific/Chatham" ||
      language.endsWith("-nz")
    ){
      return "Hamy";
    }

    /* Melbourne/Australian device/timezone => Andy */
    if(
      timezone === "Australia/Melbourne" ||
      timezone.startsWith("Australia/") ||
      language.endsWith("-au")
    ){
      return "Andy";
    }

    /* Fallback for an unusual device; this is primarily Andy's hosted page. */
    return "Andy";
  }

  function authHeaders(json){
    const h = {};
    if(json) h["Content-Type"] = "application/json";
    if(state.token) h["Authorization"] = "Bearer " + state.token;
    return h;
  }

  async function rawFetch(path, options){
    const r = await fetch(API + path, options || {});
    if(!r.ok){
      let msg = "";
      try{ msg = await r.text(); }catch(_){}
      throw new Error(msg || ("HTTP " + r.status));
    }
    const type = r.headers.get("content-type") || "";
    return type.includes("application/json") ? r.json() : null;
  }

  async function autoUnlock(){
    document.getElementById("hs-conn-status").textContent = "unlocking wall…";

    const data = await rawFetch("/space/auth", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ pin:AUTO_EDIT_PIN })
    });

    if(!data || !data.token){
      throw new Error("No edit token returned");
    }

    state.token = data.token;
    state.unlocked = true;
    document.getElementById("hs-toolbar").style.display = "flex";
  }

  function normaliseStroke(s){
    if(!s) return null;
    let points = s.points || [];
    if(typeof points === "string"){
      try{ points = JSON.parse(points); }catch(_){ points = []; }
    }
    return {
      id:s.id,
      author:s.author || "",
      color:s.color || s.colour || "#f4b8cc",
      width:Number(s.width || 3),
      points:Array.isArray(points) ? points : []
    };
  }

  function normaliseReaction(r){
    return {
      memoryId:r.memoryId || r.memory_id || "",
      author:r.author || "",
      emoji:r.emoji || r.reaction || ""
    };
  }

  async function loadState(){
    const data = await rawFetch("/space/state");

    state.strokes = (data.strokes || [])
      .map(normaliseStroke)
      .filter(Boolean);

    state.reactions = (data.reactions || [])
      .map(normaliseReaction)
      .filter(Boolean);

    state.presence = Array.isArray(data.presence) ? data.presence : [];

    redraw();
    renderReactions();
    renderPresence();
  }

  /* ---------- Canvas ---------- */

  function resizeCanvas(){
    const rect = wrap.getBoundingClientRect();

    state.width = Math.max(1, rect.width);
    state.height = Math.max(1, rect.height);
    state.dpr = Math.max(1, window.devicePixelRatio || 1);

    canvas.width = Math.round(state.width * state.dpr);
    canvas.height = Math.round(state.height * state.dpr);

    canvas.style.width = state.width + "px";
    canvas.style.height = state.height + "px";

    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    redraw();
  }

  function normPoint(e){
    const r = canvas.getBoundingClientRect();
    return {
      x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),
      y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))
    };
  }

  function brushWidth(width){
    const scale = Math.max(.72,Math.min(1.4,state.width/640));
    return Math.max(.8,Number(width || 3)*scale);
  }

  function drawStroke(s){
    if(!s || !s.points || !s.points.length) return;

    ctx.strokeStyle = s.color || "#f4b8cc";
    ctx.fillStyle = s.color || "#f4b8cc";
    ctx.lineWidth = brushWidth(s.width);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const first = s.points[0];

    if(s.points.length === 1){
      ctx.beginPath();
      ctx.arc(
        first.x*state.width,
        first.y*state.height,
        Math.max(1,brushWidth(s.width)/2),
        0,
        Math.PI*2
      );
      ctx.fill();
      return;
    }

    ctx.beginPath();
    ctx.moveTo(first.x*state.width,first.y*state.height);

    for(let i=1;i<s.points.length;i++){
      ctx.lineTo(
        s.points[i].x*state.width,
        s.points[i].y*state.height
      );
    }

    ctx.stroke();
  }

  function redraw(){
    ctx.clearRect(0,0,state.width,state.height);
    state.strokes.forEach(drawStroke);
  }

  function setMode(mode){
    state.mode = mode;

    document.querySelectorAll(".hs-mode").forEach(btn => {
      btn.classList.toggle("active",btn.dataset.mode===mode);
    });

    wrap.className = "mode-" + mode;
  }

  canvas.addEventListener("pointerdown", e => {
    if(!state.unlocked || state.mode==="move") return;

    e.preventDefault();

    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}

    const p = normPoint(e);

    if(state.mode==="draw"){
      state.drawing = true;
      state.current = {
        id:crypto.randomUUID(),
        author:state.author,
        color:state.colour,
        width:state.thickness,
        points:[p],
        createdAt:Date.now()
      };
    }else if(state.mode==="erase"){
      erasePoint(p);
    }
  });

  canvas.addEventListener("pointermove", e => {
    if(!state.unlocked || state.mode==="move") return;

    e.preventDefault();
    const p = normPoint(e);

    if(state.mode==="draw" && state.drawing && state.current){
      const points = state.current.points;
      const last = points[points.length-1];

      const dx = p.x-last.x;
      const dy = p.y-last.y;

      if(dx*dx+dy*dy < .0000015) return;

      points.push(p);

      ctx.strokeStyle = state.current.color;
      ctx.lineWidth = brushWidth(state.current.width);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(last.x*state.width,last.y*state.height);
      ctx.lineTo(p.x*state.width,p.y*state.height);
      ctx.stroke();
    }else if(state.mode==="erase"){
      erasePoint(p);
    }
  });

  function finishStroke(){
    if(!state.drawing || !state.current) return;

    state.drawing = false;
    const stroke = state.current;
    state.current = null;

    state.strokes.push(stroke);
    redraw();

    rawFetch("/space/stroke",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify(stroke)
    }).catch(() => {
      toast("stroke didn't save 😭");
      loadState().catch(()=>{});
    });
  }

  canvas.addEventListener("pointerup",finishStroke);
  canvas.addEventListener("pointercancel",finishStroke);

  function erasePoint(p){
    const now = Date.now();
    if(now-state.eraseAt<70) return;
    state.eraseAt = now;

    rawFetch("/space/erase-point",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify({
        x:p.x,
        y:p.y,
        radius:.03,
        author:state.author
      })
    }).then(data => {
      const ids = (data && (data.erased || data.strokeIds)) || [];
      if(ids.length){
        state.strokes = state.strokes.filter(s => !ids.includes(s.id));
        redraw();
      }
    }).catch(() => toast("eraser didn't save"));
  }

  /* ---------- Toolbar ---------- */

  document.querySelectorAll(".hs-mode").forEach(btn => {
    btn.addEventListener("click",()=>setMode(btn.dataset.mode));
  });

  const colourButtons = Array.from(document.querySelectorAll(".hs-colour"));

  colourButtons.forEach(btn => {
    btn.addEventListener("click",()=>{
      colourButtons.forEach(x=>x.classList.remove("selected"));
      btn.classList.add("selected");
      state.colour = btn.dataset.colour;
    });
  });

  document.getElementById("hs-custom-colour").addEventListener("input",e=>{
    state.colour = e.target.value;
    colourButtons.forEach(x=>x.classList.remove("selected"));
  });

  document.getElementById("hs-thickness").addEventListener("input",e=>{
    state.thickness = Number(e.target.value);
  });

  document.getElementById("hs-undo").addEventListener("click",()=>{
    rawFetch("/space/undo",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify({author:state.author})
    }).then(loadState).catch(()=>toast("nothing to undo"));
  });

  document.getElementById("hs-redo").addEventListener("click",()=>{
    rawFetch("/space/redo",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify({author:state.author})
    }).then(loadState).catch(()=>toast("nothing to redo"));
  });

  /* ---------- Clear + History ---------- */

  const clearModal = document.getElementById("hs-clear-modal");
  const clearInput = document.getElementById("hs-clear-confirm");
  const clearGo = document.getElementById("hs-clear-go");

  document.getElementById("hs-clear").addEventListener("click",()=>{
    clearInput.value="";
    clearGo.disabled=true;
    clearModal.classList.add("show");
    setTimeout(()=>clearInput.focus(),0);
  });

  clearInput.addEventListener("input",()=>{
    clearGo.disabled = clearInput.value !== "69";
  });

  document.getElementById("hs-clear-cancel").addEventListener("click",()=>{
    clearModal.classList.remove("show");
  });

  clearGo.addEventListener("click",()=>{
    if(clearInput.value!=="69") return;

    rawFetch("/space/clear",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify({
        confirm:"69",
        confirmation:"69",
        author:state.author
      })
    }).then(()=>{
      state.strokes=[];
      redraw();
      clearModal.classList.remove("show");
      toast("wall cleared ♡");
    }).catch(()=>toast("clear failed"));
  });

  document.getElementById("hs-history-btn").addEventListener("click",async()=>{
    const panel = document.getElementById("hs-history");

    if(getComputedStyle(panel).display!=="none"){
      panel.style.display="none";
      return;
    }

    panel.style.display="block";
    const target = document.getElementById("hs-snapshots");
    target.textContent="loading…";

    try{
      const data = await rawFetch("/space/snapshots",{
        headers:authHeaders(false)
      });

      const snaps = Array.isArray(data) ? data : ((data && data.snapshots) || []);
      target.innerHTML="";

      if(!snaps.length){
        target.textContent="no snapshots yet";
        return;
      }

      snaps.forEach(s=>{
        const row = document.createElement("div");
        row.className="hs-snap";

        const label = document.createElement("span");
        const date = s.createdAt || s.created_at;
        label.textContent = date ? new Date(date).toLocaleString() : ("snapshot "+s.id);

        const btn = document.createElement("button");
        btn.className="hs-btn";
        btn.textContent="Restore";

        btn.addEventListener("click",()=>{
          if(!confirm("Restore this wall snapshot?")) return;

          rawFetch("/space/restore",{
            method:"POST",
            headers:authHeaders(true),
            body:JSON.stringify({snapshotId:s.id})
          }).then(()=>{
            toast("wall restored ♡");
            loadState();
          }).catch(()=>toast("restore failed"));
        });

        row.append(label,btn);
        target.appendChild(row);
      });
    }catch(_){
      target.textContent="couldn't load history";
    }
  });

  /* ---------- Reactions ---------- */

  function reactionAnchor(media){
    /*
      Put the reaction bar inside the same .reveal block,
      AFTER the media, so it does not create a second reveal layout.
    */
    const reveal = media.closest(".reveal");
    return reveal || media.parentElement || media;
  }

  function renderReactions(){
    document.querySelectorAll("[data-memory-id]").forEach(media=>{
      const id = media.dataset.memoryId;
      if(!id) return;

      const anchor = reactionAnchor(media);

      let bar = anchor.querySelector(':scope > .hs-memory-reactions');

      if(!bar){
        bar = document.createElement("div");
        bar.className="hs-memory-reactions";
        anchor.appendChild(bar);
      }

      buildReactionBar(bar,id);
    });
  }

  function buildReactionBar(bar,memoryId){
    bar.innerHTML="";

    const rows = state.reactions.filter(r=>r.memoryId===memoryId);
    const counts = new Map();

    rows.forEach(r=>{
      counts.set(r.emoji,(counts.get(r.emoji)||0)+1);
    });

    EMOJIS.forEach(emoji=>{
      const count = counts.get(emoji)||0;
      if(!count) return;

      const mine = rows.some(r=>r.author===state.author && r.emoji===emoji);

      const b = document.createElement("button");
      b.className="hs-used-reaction"+(mine?" mine":"");
      b.textContent=emoji+" "+count;
      b.addEventListener("click",()=>toggleReaction(memoryId,emoji));
      bar.appendChild(b);
    });

    const open = document.createElement("button");
    open.className="hs-react-open";
    open.textContent="♡ react";
    bar.appendChild(open);

    const picker = document.createElement("div");
    picker.className="hs-picker";

    EMOJIS.forEach(emoji=>{
      const mine = rows.some(r=>r.author===state.author && r.emoji===emoji);

      const b = document.createElement("button");
      b.className="hs-emoji"+(mine?" mine":"");
      b.textContent=emoji;
      b.addEventListener("click",()=>toggleReaction(memoryId,emoji));
      picker.appendChild(b);
    });

    open.addEventListener("click",()=>{
      picker.classList.toggle("show");
    });

    bar.appendChild(picker);
  }

  function toggleReaction(memoryId,emoji){
    const existing = state.reactions.findIndex(
      r=>r.memoryId===memoryId && r.author===state.author && r.emoji===emoji
    );

    if(existing>=0){
      state.reactions.splice(existing,1);
    }else{
      state.reactions.push({
        memoryId,
        author:state.author,
        emoji
      });
    }

    renderReactions();

    rawFetch("/space/reaction",{
      method:"POST",
      headers:authHeaders(true),
      body:JSON.stringify({
        memoryId,
        author:state.author,
        emoji
      })
    }).then(loadState).catch(()=>{
      toast("reaction didn't save");
      loadState().catch(()=>{});
    });
  }

  /* ---------- WebSocket / Presence ---------- */

  function renderPresence(){
    const names = Array.from(
      new Set(
        (state.presence || []).filter(x=>x==="Andy" || x==="Hamy")
      )
    );

    const el = document.getElementById("hs-presence");

    if(!names.length){
      el.innerHTML='<span class="hs-dot" style="background:#888"></span>just you here';
    }else if(names.length===1){
      if(names[0]===state.author){
        el.innerHTML='<span class="hs-dot"></span>you’re here ♡';
      }else{
        el.innerHTML='<span class="hs-dot"></span>'+names[0]+' is here ❤️';
      }
    }else{
      el.innerHTML='<span class="hs-dot"></span>Andy + Hamy are here ❤️';
    }
  }

  function wsUrl(){
    const q = new URLSearchParams({
      author:state.author,
      token:state.token
    });
    return WS_URL+"?"+q.toString();
  }

  function connectWebSocket(){
    /*
      IMPORTANT: this is called only AFTER author detection + auto-auth.
      That prevents the old "Unknown" connection and prevents rapidly
      switching Andy/Hamy from creating two simultaneous presences.
    */
    if(!state.token || !state.author) return;

    if(state.ws){
      try{ state.ws.onclose=null; state.ws.close(); }catch(_){}
      state.ws=null;
    }

    const ws = new WebSocket(wsUrl());
    state.ws = ws;

    document.getElementById("hs-conn-status").textContent="connecting…";

    ws.onopen=()=>{
      if(state.ws!==ws) return;

      state.reconnectAttempt=0;
      document.getElementById("hs-conn-status").textContent="connected ❤️";
      document.getElementById("hs-conn-status").style.color="#75db9a";

      loadState().catch(()=>{});
    };

    ws.onmessage=e=>{
      if(state.ws!==ws) return;

      let msg;
      try{ msg=JSON.parse(e.data); }catch(_){ return; }

      if(msg.type==="init"){
        const s=msg.state||{};
        state.strokes=(s.strokes||[]).map(normaliseStroke).filter(Boolean);
        state.reactions=(s.reactions||[]).map(normaliseReaction).filter(Boolean);
        state.presence=Array.isArray(s.presence)?s.presence:[];
        redraw();
        renderReactions();
        renderPresence();
        return;
      }

      if(msg.type==="presence"){
        state.presence=msg.present||msg.presence||[];
        renderPresence();
        return;
      }

      if(msg.type==="stroke" || msg.type==="stroke.added"){
        const s=normaliseStroke(msg.stroke);
        if(s && !state.strokes.some(x=>x.id===s.id)){
          state.strokes.push(s);
          drawStroke(s);
        }
        return;
      }

      if(msg.type==="erase"){
        const id=msg.strokeId||msg.id;
        state.strokes=state.strokes.filter(s=>s.id!==id);
        redraw();
        return;
      }

      if(msg.type==="erase-batch" || msg.type==="stroke.erased"){
        const ids=msg.strokeIds||msg.ids||[];
        state.strokes=state.strokes.filter(s=>!ids.includes(s.id));
        redraw();
        return;
      }

      if(msg.type==="clear" || msg.type==="board.cleared"){
        state.strokes=[];
        redraw();
        return;
      }

      if(
        msg.type==="restore" ||
        msg.type==="restore_stroke" ||
        msg.type==="board.restored"
      ){
        loadState().catch(()=>{});
        return;
      }

      if(msg.type==="reaction" || msg.type==="reaction.updated"){
        loadState().catch(()=>{});
      }
    };

    ws.onerror=()=>{};

    ws.onclose=()=>{
      if(state.ws!==ws) return;

      state.ws=null;
      document.getElementById("hs-conn-status").style.color="";
      document.getElementById("hs-conn-status").textContent="reconnecting…";

      const delay=Math.min(15000,900*Math.pow(2,Math.min(state.reconnectAttempt++,4)));

      clearTimeout(state.reconnectTimer);

      state.reconnectTimer=setTimeout(connectWebSocket,delay);
    };
  }

  /* ---------- Start ---------- */

  async function start(){
    /*
      Detect BEFORE opening a socket.
      NZ => Hamy, Australia/Melbourne => Andy.
    */
    state.author = detectAuthor();

    document.getElementById("hs-identity").textContent =
      "automatically posting as ♡ " + state.author + " ♡";

    resizeCanvas();
    window.addEventListener("resize",resizeCanvas,{passive:true});

    try{
      await autoUnlock();
      await loadState();
      connectWebSocket();
      setMode("move");
    }catch(err){
      document.getElementById("hs-conn-status").textContent="wall couldn't unlock 😭";
      toast("wall setup failed");
      console.error(err);
    }
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible") return;

    loadState().catch(()=>{});

    if(!state.ws || state.ws.readyState>1){
      connectWebSocket();
    }
  });

  window.addEventListener("online",()=>{
    if(!state.ws || state.ws.readyState>1){
      connectWebSocket();
    }
  });

  start();

})();
</script>

</body>
</html>
